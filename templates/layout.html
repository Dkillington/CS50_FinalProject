<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="initial-scale=1, width=device-width">

        <!-- http://getbootstrap.com/docs/5.1/ -->
        <link href="/static/vendor/bootstrap.min.css" rel="stylesheet">
        <script src="/static/vendor/bootstrap.bundle.min.js"></script>

        <link href="/static/styles.css" rel="stylesheet">
        <title>{% block title %}{% endblock %}</title>
    </head>
    <body>
        {% if sample_data %}
        <div class="alert alert-info mb-0 rounded-0" role="status"><strong>Sample data.</strong> These fictional channels and video counts demonstrate the dashboard; they are not measurements from YouTube.</div>
        {% endif %}
        <div class = "header">
            <div class = "headerBar"><h1><b>YouTube Channel Statistics</b></h1></div>
            <div class = "buttonBar">
                <button><a href="/channelInfo" style = "text-decoration: none; color: black;">View a Channel's Stats</a></button>
                <button><a href="/databaseInfo" style = "text-decoration: none; color: black;">View Database Stats</a></button>
                <button><a href="/about" style = "text-decoration: none; color: black;">About</a></button>
            </div>
        </div>
        <main class="container-fluid py-5 text-center">
            {% block main %}{% endblock %}
        </main>
    </body>
</html>
